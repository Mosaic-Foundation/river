name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only token. This workflow uses no secrets, so thread branches can't leak any through it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id "ci" is the status check the repo ruleset requires. Keep it, and keep every
  # gate inside this one job so a single required check covers them all.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned by commit SHA, as in the Civic Hub. The checkout keeps no token in
      # .git/config: nothing later in the job pushes, and installs and tests run third-party code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      # Same npm as the Civic Hub CI and Vercel's Node 24 image. npm 10 fails to resolve
      # vitest 4's peer set ("Cannot read properties of null (reading 'edgesOut')").
      - name: Pin npm
        run: npm i -g npm@12.2.0

      - name: Install and audit (server)
        run: |
          npm ci --include=dev
          npm audit --audit-level=high

      - name: Build, typecheck, lint
        run: |
          npm run build
          npm run typecheck
          npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Install, audit, lint, build (ui)
        working-directory: ui
        run: |
          npm ci --include=dev
          npm audit --audit-level=high
          npm run lint
          npm run build

      # API tests need a database. supabase/config.toml (from `npx supabase init`) turns them on;
      # config.toml runs only Postgres. The CLI version comes from package.json.
      - name: Detect database
        id: db
        run: |
          if [ -f supabase/config.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      # Applies supabase/migrations/ and then supabase/seed.sql, which makes river_app and
      # identity_app LOGIN roles with the password local-only.
      - name: Start local Supabase
        if: steps.db.outputs.present == 'true'
        run: |
          npx supabase start
          npx supabase status

      # Fails early, and plainly, if either role can't log in or has a way around row-level security.
      - name: Connect as each app role
        if: steps.db.outputs.present == 'true'
        run: |
          for role in river_app identity_app; do
            got=$(psql "postgresql://$role:local-only@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -At -c \
              "SELECT current_user, rolsuper, rolbypassrls FROM pg_roles WHERE rolname = current_user")
            echo "$got"
            [ "$got" = "$role|f|f" ] || { echo "$role is not a plain LOGIN role without BYPASSRLS"; exit 1; }
          done

      # Local values only, written fresh for each run. Both apps connect as their own role on the
      # local stack (supabase/seed.sql sets the local-only passwords). The River trusts the identity
      # host's DIDs (localhost:3001) and the API tests' own DID logs (localhost:3005), and reads
      # their logs over loopback http only because TEST_DID_LOOPBACK=1 (refused on Vercel). Linking
      # fediverse accounts talks only to the stand-in server (TEST_STAND_IN_FEDIVERSE=1, also
      # refused on Vercel), and seals what it stores with a RIVER_TOKEN_KEY made for this run.
      # Secrets are generated per run and masked. The UI is served on 4173 below.
      - name: Write .env and .env.identity
        run: |
          river_session=$(openssl rand -hex 32)
          identity_session=$(openssl rand -hex 32)
          master_key=$(openssl rand -base64 32)
          river_token_key=$(openssl rand -base64 32)
          echo "::add-mask::$river_session"
          echo "::add-mask::$river_token_key"
          echo "::add-mask::$identity_session"
          echo "::add-mask::$master_key"
          # A throwaway recovery key pair for this run only (check 37), outside the checkout. The
          # identity host gets the public half; the e2e test runs recover-dids with the file.
          recovery_key="$RUNNER_TEMP/recovery-test.pem"
          openssl genpkey -algorithm ed25519 -out "$recovery_key"
          recovery_public=$(npx tsx scripts/recover-dids.ts --print-public-key --key-file "$recovery_key")
          echo "TEST_RECOVERY_KEY_FILE=$recovery_key" >> "$GITHUB_ENV"
          cat > .env <<EOF
          APP=river
          PORT=3000
          DATABASE_URL=postgresql://river_app:local-only@127.0.0.1:54322/postgres
          SESSION_SECRET=$river_session
          RIVER_PUBLIC_ORIGIN=http://localhost:4173
          IDENTITY_ORIGIN=http://localhost:3001
          TRUSTED_DID_HOSTS=localhost:3001,localhost:3005
          INSTANCE_HOST_ALIASES=localhost,127.0.0.1
          FETCH_FIXTURES_DIR=tests/fixtures/http
          TEST_ROUTES=1
          TEST_CLOCK_NOW=2026-10-21T00:00:00.000Z
          TEST_DID_LOOPBACK=1
          RIVER_TOKEN_KEY=$river_token_key
          TEST_STAND_IN_FEDIVERSE=1
          EOF
          cat > .env.identity <<EOF
          APP=identity
          PORT=3001
          DATABASE_URL=postgresql://identity_app:local-only@127.0.0.1:54322/postgres
          SESSION_SECRET=$identity_session
          IDENTITY_MASTER_KEY=$master_key
          IDENTITY_RECOVERY_PUBLIC_KEY=$recovery_public
          RP_ID=localhost
          IDENTITY_PUBLIC_ORIGIN=http://localhost:3001
          RIVER_CLIENT_ORIGINS=http://localhost:5173,http://localhost:4173
          EMAIL_TRANSPORT=capture
          EMAIL_FROM="Mosaic ID <id@localhost>"
          FETCH_FIXTURES_DIR=tests/fixtures/http
          TEST_ROUTES=1
          EOF

      - name: Start the River API and the identity host
        run: |
          npm run build:identity-client
          npm run dev > /tmp/api.log 2>&1 &
          npm run dev:identity > /tmp/identity.log 2>&1 &
          for port in 3000 3001; do
            ok=false
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:$port/health"; then ok=true; echo; break; fi
              sleep 1
            done
            if [ "$ok" != true ]; then cat /tmp/api.log /tmp/identity.log; exit 1; fi
          done

      # Includes tests/api/db/, which connects as river_app and identity_app (never postgres) to
      # prove row-level security and schema isolation (acceptance check 27). The local stack's
      # postgres role is used only to run the daily job (as pg_cron does, in a rolled-back
      # transaction) and to count rows river_app can't see.
      - name: API tests
        if: steps.db.outputs.present == 'true' && hashFiles('tests/api/**/*.test.ts') != ''
        env:
          TEST_RIVER_DATABASE_URL: postgresql://river_app:local-only@127.0.0.1:54322/postgres
          TEST_IDENTITY_DATABASE_URL: postgresql://identity_app:local-only@127.0.0.1:54322/postgres
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run test:api || (cat /tmp/api.log /tmp/identity.log; exit 1)

      # End-to-end against the production UI bundle (vite preview proxies /api like dev).
      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run preview --prefix ui -- --port 4173 --strictPort > /tmp/ui.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 > /dev/null && break; sleep 1; done
          E2E_BASE_URL=http://localhost:4173 E2E_IDENTITY_URL=http://localhost:3001 npx playwright test || (cat /tmp/api.log /tmp/identity.log /tmp/ui.log; exit 1)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
